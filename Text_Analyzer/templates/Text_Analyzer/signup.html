{% extends "Text_Analyzer/base.html" %}


{% block content %}
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-panel">
            <div class="auth-copy">
                <a class="home-link" href="{% url 'TAnalyzer:home' %}">Back to Analyzer</a>
                <a class="home-link" href="{% url 'TAnalyzer:login' %}">Login</a>
                <h1>Create Account</h1>
                <p>Sign up to save text analysis history and manage your profile.</p>
            </div>

            <form class="auth-form" action="#" method="post">
                 {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" placeholder="Choose a username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input id="confirm-password" name="confirm_password" type="password" placeholder="Confirm your password" autocomplete="new-password" required>
                </div>
                {% if error_messages %}
                <div class="message-box">
                    {{error_messages}}
                </div>
                {% endif %}
                <button class="auth-submit" type="submit">Sign Up</button>

                <p class="auth-note">
                    Already have an account? <a href="{% url 'TAnalyzer:login' %}">Login</a>
                </p>
            </form>
        </section>
    </main>
</body>
{% endblock %}
