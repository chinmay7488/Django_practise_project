{% extends "Text_Analyzer/base.html" %}


{% block content %}
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-panel confirm-panel">
            <div class="auth-copy">
                <a class="home-link" href="{% url 'TAnalyzer:home' %}">Back to Analyzer</a>
                <a class="home-link" href="{% url 'TAnalyzer:login' %}">Login</a>
                <h1>Logout</h1>
                <p>End your current session and return to the public analyzer page.</p>
            </div>

            <form class="auth-form" action="#" method="post">
                <div class="confirm-box">
                    <strong>Are you sure you want to logout?</strong>
                    <p>Your saved analyses will stay in your account.</p>
                </div>

                <div class="auth-actions">
                    <a class="button-link secondary-link" href="{% url 'TAnalyzer:profile' %}">Cancel</a>
                    <button class="auth-submit" type="submit">Logout</button>
                </div>
            </form>
        </section>
    </main>
</body>
{% endblock %}
