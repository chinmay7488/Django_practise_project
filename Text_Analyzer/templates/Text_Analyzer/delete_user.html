{% extends "Text_Analyzer/base.html" %}


{% block content %}
<body class="auth-page danger-page">
    <main class="auth-shell">
        <section class="auth-panel confirm-panel">
            <div class="auth-copy">
                <a class="home-link" href="{% url 'TAnalyzer:profile' %}">Back to Profile</a>
                <a class="home-link" href="{% url 'TAnalyzer:logout' %}">Logout</a>
                <h1>Delete User</h1>
                <p>Permanently remove this account and all saved text analysis data.</p>
            </div>

            <form class="auth-form" action="#" method="post">
                <div class="confirm-box danger-box">
                    <strong>This action cannot be undone.</strong>
                    <p>Type your username below before deleting the account.</p>
                </div>

                <div class="form-group">
                    <label for="confirm-username">Confirm username</label>
                    <input id="confirm-username" name="confirm_username" type="text" placeholder="Type username" autocomplete="off" required>
                </div>

                <div class="auth-actions">
                    <a class="button-link secondary-link" href="{% url 'TAnalyzer:profile' %}">Cancel</a>
                    <button class="auth-submit danger-submit" type="submit">Delete User</button>
                </div>
            </form>
        </section>
    </main>
</body>
{% endblock%}
