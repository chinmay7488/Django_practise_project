{% extends "Recipe_Meal_Planner/base.html" %} 
{% block Title %}Register{% endblock %}
{% block content %}

<body>
    <header class="topbar">
        <a class="brand" href="{% url 'Recipe_Meal_Planner:home' %}"><span class="brand-mark">RM</span><span>Recipe Meal Planner</span></a>
        <nav class="nav"><a href="{% url 'Recipe_Meal_Planner:home' %}">Dashboard</a><a href="{% url 'Recipe_Meal_Planner:login' %}">Login</a></nav>
    </header>
    <main class="auth-wrap">
        <form class="auth-panel">
            <p class="eyebrow">Personal planner</p>
            <h1>Create Account</h1>
            <label class="mt-lg">Name<input type="text" placeholder="Your name"></label>
            <label class="mt-sm">Email<input type="email" placeholder="you@example.com"></label>
            <label class="mt-sm">Password<input type="password" placeholder="Password"></label>
            <div class="form-actions mt-md"><button class="primary" type="button">Register</button><a class="button" href="{% url 'Recipe_Meal_Planner:login' %}">Login</a></div>
        </form>
    </main>
</body>
{% endblock %}
