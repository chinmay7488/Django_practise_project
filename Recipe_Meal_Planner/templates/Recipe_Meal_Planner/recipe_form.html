{% extends "Recipe_Meal_Planner/base.html" %} 
{% block Title %}Recipe Form{% endblock %}
{% block content %}

<body>
    <header class="topbar">
        <a class="brand" href="{% url 'Recipe_Meal_Planner:home' %}"><span class="brand-mark">RM</span><span>Recipe Meal Planner</span></a>
        <nav class="nav"><a href="{% url 'Recipe_Meal_Planner:recipes' %}">Recipes</a><a href="{% url 'Recipe_Meal_Planner:meal_planner' %}">Planner</a><a href="{% url 'Recipe_Meal_Planner:shopping_list' %}">Shopping List</a></nav>
    </header>
    <main class="page">
        <section class="panel">
            <p class="eyebrow">Create or edit</p>
            <h1>Recipe Details</h1>
            <form class="form-grid mt-lg">
                <label class="full">Recipe Title<input type="text" placeholder="Herbed Lemon Pasta"></label>
                <label class="full">Description<textarea placeholder="Short recipe description"></textarea></label>
                <label>Preparation Time<input type="number" placeholder="35"></label>
                <label>Category<select><option>Breakfast</option><option>Lunch</option><option>Dinner</option></select></label>
                <label class="full">Recipe Photo<input type="file"></label>
                <label class="full">Instructions<textarea placeholder="Step-by-step instructions"></textarea></label>
                <label>Calories<input type="number" placeholder="520"></label>
                <label>Protein<input type="number" placeholder="24"></label>
                <label>Carbs<input type="number" placeholder="68"></label>
                <label>Fats<input type="number" placeholder="14"></label>
                <div class="full panel flat-card">
                    <h2>Ingredients</h2>
                    <div id="ingredient-list" class="ingredient-list mt-sm">
                        <div class="ingredient-row form-grid">
                            <label>Ingredient<select name="ingredient[]"><option>Pasta</option><option>Chickpeas</option><option>Lemon</option></select></label>
                            <label>New Ingredient<input name="new_ingredient[]" type="text" placeholder="Type if not in list"></label>
                            <label>Quantity<input name="quantity[]" type="text" placeholder="180"></label>
                            <label>Unit<select name="unit[]"><option>g</option><option>cup</option><option>piece</option></select></label>
                            <label>Calories<input name="calories[]" type="number" placeholder="280"></label>
                            <div class="form-actions full">
                                <button class="remove-ingredient" type="button">Remove</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-actions mt-sm">
                        <button id="add-ingredient" class="primary" type="button">Add Ingredient</button>
                    </div>
                </div>
                <div class="form-actions full">
                    <button class="primary" type="button">Save Recipe</button>
                    <a class="button" href="{% url 'Recipe_Meal_Planner:recipes' %}">Cancel</a>
                </div>
            </form>
        </section>
    </main>
    <script>
        const ingredientList = document.getElementById("ingredient-list");
        const addIngredientButton = document.getElementById("add-ingredient");

        function updateRemoveButtons() {
            const rows = ingredientList.querySelectorAll(".ingredient-row");
            rows.forEach((row) => {
                row.querySelector(".remove-ingredient").disabled = rows.length === 1;
            });
        }

        function updateIngredientSelect(row) {
            const ingredientSelect = row.querySelector('select[name="ingredient[]"]');
            const newIngredientInput = row.querySelector('input[name="new_ingredient[]"]');

            ingredientSelect.disabled = newIngredientInput.value.trim() !== "";
        }

        addIngredientButton.addEventListener("click", () => {
            const firstRow = ingredientList.querySelector(".ingredient-row");
            const newRow = firstRow.cloneNode(true);

            newRow.querySelectorAll("input").forEach((input) => {
                input.value = "";
            });
            newRow.querySelectorAll("select").forEach((select) => {
                select.disabled = false;
                select.selectedIndex = 0;
            });

            ingredientList.appendChild(newRow);
            updateRemoveButtons();
        });

        ingredientList.addEventListener("click", (event) => {
            if (!event.target.classList.contains("remove-ingredient")) {
                return;
            }

            const rows = ingredientList.querySelectorAll(".ingredient-row");
            if (rows.length > 1) {
                event.target.closest(".ingredient-row").remove();
                updateRemoveButtons();
            }
        });

        ingredientList.addEventListener("input", (event) => {
            if (event.target.name !== "new_ingredient[]") {
                return;
            }

            updateIngredientSelect(event.target.closest(".ingredient-row"));
        });

        updateRemoveButtons();
        ingredientList.querySelectorAll(".ingredient-row").forEach(updateIngredientSelect);
    </script>
</body>
{% endblock %}
