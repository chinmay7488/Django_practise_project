{% extends "Recipe_Meal_Planner/base.html" %} 
{% block Title %}Recipe Form{% endblock %}
{% block content %}

<body>
    <header class="topbar">
        <a class="brand" href="{% url 'Recipe_Meal_Planner:home' %}"><span class="brand-mark">RM</span><span>Recipe Meal Planner</span></a>
        <nav class="nav"><a href="{% url 'Recipe_Meal_Planner:recipes' %}">Recipes</a><a href="{% url 'Recipe_Meal_Planner:meal_planner' %}">Planner</a><a href="{% url 'Recipe_Meal_Planner:shopping_list' %}">Shopping List</a></nav>
    </header>
    <main class="page">
        <section class="panel">
            <p class="eyebrow">Create or edit</p>
            <h1>Recipe Details</h1>
            <form class="form-grid mt-lg">
                <label class="full">Recipe Title<input type="text" placeholder="Herbed Lemon Pasta"></label>
                <label class="full">Description<textarea placeholder="Short recipe description"></textarea></label>
                <label>Preparation Time<input type="number" placeholder="35"></label>
                <label>Category<select><option>Breakfast</option><option>Lunch</option><option>Dinner</option></select></label>
                <label class="full">Recipe Photo<input type="file"></label>
                <label class="full">Instructions<textarea placeholder="Step-by-step instructions"></textarea></label>
                <label>Calories<input type="number" placeholder="520"></label>
                <label>Protein<input type="number" placeholder="24"></label>
                <label>Carbs<input type="number" placeholder="68"></label>
                <label>Fats<input type="number" placeholder="14"></label>
                <div class="full panel flat-card">
                    <h2>Ingredients</h2>
                    <div class="form-grid mt-sm">
                        <label>Ingredient<select><option>Pasta</option><option>Chickpeas</option><option>Lemon</option></select></label>
                        <label>Quantity<input type="text" placeholder="180"></label>
                        <label>Unit<select><option>g</option><option>cup</option><option>piece</option></select></label>
                        <label>Calories<input type="number" placeholder="280"></label>
                    </div>
                </div>
                <div class="form-actions full">
                    <button class="primary" type="button">Save Recipe</button>
                    <a class="button" href="{% url 'Recipe_Meal_Planner:recipes' %}">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</body>
{% endblock %}
