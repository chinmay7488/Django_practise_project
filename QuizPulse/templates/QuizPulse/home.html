{% extends 'QuizPulse/base.html' %}

{% block title %}Quiz Setup | QuizPulse{% endblock %}

{% block content %}
<section class="hero-panel">
    <div>
        <p class="eyebrow">Session based quiz app</p>
        <h1>Build your quiz round</h1>
        <p class="intro">Choose the quiz size, category, difficulty, and question type before starting.</p>
    </div>
    <div class="timer-chip">5 min limit</div>
</section>

<section class="form-panel">
    <form method="post" action="{% url 'QuizPulse:start_quiz' %}" class="setup-form">
        {% csrf_token %}

        <label>
            Number of Questions
            <select name="amount">
                <option value="5">5 Questions</option>
                <option value="10">10 Questions</option>
                <option value="20">20 Questions</option>
            </select>
        </label>

        <label>
            Category
            <select name="category">
                {% for category_id, category_name in categories.items %}
                    <option value="{{ category_id }}">{{ category_name }}</option>
                {% endfor %}
            </select>
        </label>

        <label>
            Difficulty
            <select name="difficulty">
                {% for difficulty in difficulties %}
                    <option value="{{ difficulty }}">{{ difficulty|title }}</option>
                {% endfor %}
            </select>
        </label>

        <label>
            Question Type
            <select name="question_type">
                {% for type_value, type_label in question_types %}
                    <option value="{{ type_value }}">{{ type_label }}</option>
                {% endfor %}
            </select>
        </label>

        <button type="submit" class="primary-button">Start Quiz</button>
    </form>
</section>
{% endblock %}
