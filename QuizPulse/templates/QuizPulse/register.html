{% extends 'QuizPulse/base.html' %}

{% block title %}Register | QuizPulse{% endblock %}

{% block content %}
<section class="auth-panel">
    <div class="auth-copy">
        <p class="eyebrow">Join QuizPulse</p>
        <h1>Create your account</h1>
        <p class="intro">Your account gets its own Open Trivia session token, so quiz questions stay fresh for you.</p>
    </div>

    <form method="post" class="auth-form">
        {% csrf_token %}

        <label>
            Username
            <input type="text" name="username" autocomplete="username" required>
        </label>

        <label>
            Email
            <input type="email" name="email" autocomplete="email">
        </label>

        <label>
            Password
            <input type="password" name="password" autocomplete="new-password" required>
        </label>

        <label>
            Confirm Password
            <input type="password" name="confirm_password" autocomplete="new-password" required>
        </label>

        <button type="submit" class="primary-button">Create Account</button>
        <p class="auth-switch">Already registered? <a href="{% url 'QuizPulse:login' %}">Login</a></p>
    </form>
</section>
{% endblock %}
