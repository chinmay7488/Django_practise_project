{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuizPulse{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'QuizPulse/style.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <a class="brand" href="{% url 'QuizPulse:home' %}">QuizPulse</a>
            <div class="nav-links">
                {% if user.is_authenticated %}
                    <a href="{% url 'QuizPulse:home' %}">Setup</a>
                    <a href="{% url 'QuizPulse:review' %}">Review</a>
                    <a href="{% url 'QuizPulse:restart' %}">Restart</a>
                    <a href="{% url 'QuizPulse:logout' %}">Logout</a>
                {% else %}
                    <a href="{% url 'QuizPulse:login' %}">Login</a>
                    <a href="{% url 'QuizPulse:register' %}">Register</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main class="page-shell">
        {% if messages %}
            <div class="message-list global-messages">
                {% for message in messages %}
                    <p class="message {{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
