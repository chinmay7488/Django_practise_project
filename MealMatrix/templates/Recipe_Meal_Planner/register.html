{% extends "Recipe_Meal_Planner/base.html" %} 
{% block Title %}Register{% endblock %}
{% block content %}

<body>
    <header class="topbar">
        <a class="brand" href="{% url 'Recipe_Meal_Planner:home' %}"><span class="brand-mark">RM</span><span>Recipe Meal Planner</span></a>
        <nav class="nav"><a href="{% url 'Recipe_Meal_Planner:home' %}">Dashboard</a><a href="{% url 'Recipe_Meal_Planner:login' %}">Login</a></nav>
    </header>
    <main class="auth-wrap">
        <form class="auth-panel" method='post'>
            {% csrf_token %} 
            <p class="eyebrow">Personal planner</p>
            <h1>Create Account</h1>
            <label class="mt-lg">Name<input name="Username" type="text" placeholder="Your name"></label>
            <label class="mt-sm">Email<input name="email" type="" placeholder="you@example.com"></label>
            <label class="mt-sm">Phone Number<input name="phonenumber" type="number" placeholder="you@example.com"></label>
            <label class="mt-sm">Password<input name="password" type="password" placeholder="Password"></label>
            {% if error_messages %}
                <div class="message-box">
                    {{ error_messages }}
                </div>
            {% endif %}
            <div class="form-actions mt-md">
                <button class="primary" type="submit">Register</button>
                <a class="button" href="{% url 'Recipe_Meal_Planner:login' %}">Login</a>
            </div>
        </form>
    </main>
</body>
{% endblock %}
