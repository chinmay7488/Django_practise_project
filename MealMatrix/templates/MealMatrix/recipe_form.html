{% extends "MealMatrix/base.html" %} 
{% block Title %}Recipe Form{% endblock %}
{% block content %}

<body>
    <header class="topbar">
        <a class="brand" href="{% url 'MealMatrix:home' %}"><span class="brand-mark">RM</span><span>Recipe Meal Planner</span></a>
        <nav class="nav"><a href="{% url 'MealMatrix:recipes' %}">Recipes</a><a href="{% url 'MealMatrix:meal_planner' %}">Planner</a><a href="{% url 'MealMatrix:shopping_list' %}">Shopping List</a></nav>
    </header>
    <main class="page">
        <section class="panel">
            <p class="eyebrow">Create or edit</p>
            <h1>Recipe Details</h1>
            <form class="form-grid mt-lg" method='post'>
                {% csrf_token %} 
                <label class="full">Recipe Title<input type="text" name="Recipe_title" placeholder="Herbed Lemon Pasta"></label>
                <label class="full">Description<textarea name="Recipe_desc" placeholder="Short recipe description"></textarea></label>
                <label>Preparation Time<input type="number" name="Recipe_time" placeholder="35"></label>
                <label>Category<select name="Recipe_catergory">
                {% if Recipe_Category%}
                    {% for value, label in Recipe_Category %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                {% else %}
                    <option value="">Some error coming</option>
                {% endif %}
                </select></label>
                <label class="full">Recipe Photo<input name="Recipe_photo" type="file"></label>
                <label class="full">Instructions<textarea  name="Recipe_instr" placeholder="Step-by-step instructions"></textarea></label>
                <label>Calories<input type="number" name="Recipe_cal" placeholder="520"></label>
                <label>Protein<input type="number" name="Recipe_pro" placeholder="24"></label>
                <label>Carbs<input type="number" name="Recipe_carbs" placeholder="68"></label>
                <label>Fats<input type="number" name="Recipe_fat" placeholder="14"></label>
                <div class="full panel flat-card">
                    <h2>Ingredients</h2>
                    <div class="form-actions mt-sm">
                        <span class="field-label ingredient-help">Cannot find ingredient</span>
                        <a class="button" href="{% url 'MealMatrix:ingredient_add' %}">Add Ingredient</a>
                    </div>
                    <div id="ingredient-list" class="ingredient-list mt-sm">
                        <div class="ingredient-row form-grid">
                            <label>Ingredient<select name="ingredient[]">
                                {% if Ingredients%}
                                    <option value="0">Select any ingredient</option>
                                    {% for ingredient in Ingredients %}
                                        <option value="{{ ingredient.id }}">{{ ingredient.Name }}</option>
                                    {% endfor %}
                                {% else %}
                                    <option value="">No ingredients added</option>
                                {% endif %}
                            </select></label>
                            <label>Quantity<input name="quantity[]" type="text" placeholder="180"></label>
                            <label>Unit<select name="unit[]"><option>g</option><option>cup</option><option>piece</option></select></label>
                            <label>Calories<input name="calories[]" type="number" placeholder="280"></label>
                            <div class="form-actions full">
                                <button class="remove-ingredient" type="button">Remove</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-actions mt-sm">
                        <button id="add-ingredient" class="primary" type="button">Add Ingredient</button>
                    </div>
                </div>
                <div class="form-actions full">
                    <button class="primary" type="submit">Save Recipe</button>
                    <a class="button" href="{% url 'MealMatrix:recipes' %}">Cancel</a>
                </div>
            </form>
        </section>
    </main>
    <script>
        const ingredientList = document.getElementById("ingredient-list");
        const addIngredientButton = document.getElementById("add-ingredient");

        function updateRemoveButtons() {
            const rows = ingredientList.querySelectorAll(".ingredient-row");
            rows.forEach((row) => {
                row.querySelector(".remove-ingredient").disabled = rows.length === 1;
            });
        }

        addIngredientButton.addEventListener("click", () => {
            const firstRow = ingredientList.querySelector(".ingredient-row");
            const newRow = firstRow.cloneNode(true);

            newRow.querySelectorAll("input").forEach((input) => {
                input.value = "";
            });
            newRow.querySelectorAll("select").forEach((select) => {
                select.disabled = false;
                select.selectedIndex = 0;
            });

            ingredientList.appendChild(newRow);
            updateRemoveButtons();
        });

        ingredientList.addEventListener("click", (event) => {
            if (!event.target.classList.contains("remove-ingredient")) {
                return;
            }

            const rows = ingredientList.querySelectorAll(".ingredient-row");
            if (rows.length > 1) {
                event.target.closest(".ingredient-row").remove();
                updateRemoveButtons();
            }
        });

        updateRemoveButtons();
    </script>
</body>
{% endblock %}
