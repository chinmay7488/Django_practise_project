{% extends "MealMatrix/base.html" %} 
{% block Title %}Login{% endblock %}
{% block content %}

<body>
    <header class="topbar">
        <a class="brand" href="{% url 'MealMatrix:home' %}"><span class="brand-mark">RM</span><span>Recipe Meal Planner</span></a>
        <nav class="nav"><a href="{% url 'MealMatrix:home' %}">Dashboard</a><a href="{% url 'MealMatrix:register' %}">Register</a></nav>
    </header>
    <main class="auth-wrap">
        <form class="auth-panel" method="post">
            {%csrf_token%}
            <p class="eyebrow">Welcome back</p>
            <h1>Login</h1>
            <label class="mt-lg">Username<input type="username" name="username" ></label>
            <label class="mt-sm">Password<input type="password" name="password" placeholder="Password"></label>
            <div class="form-actions mt-md"><button class="primary" type="sumbit">Login</button><a class="button" href="{% url 'MealMatrix:register' %}">Create Account</a></div>
        </form>
    </main>
</body>
{% endblock %}
